# ---------------------------------------------------------------------------
# CYD Flags - sim racing flag display for the "Cheap Yellow Display"
#
# Board: ESP32-2432S028R (2.8" 320x240 ILI9341, ESP32-WROOM-32)
#        Portrait 240x320 by default; set display_rotation: "90" for landscape.
#
# The display is driven by a SimHub plugin (CydFlags.dll) over the ESPHome
# web server REST API:
#
#   POST /select/flag/set?option=YELLOW
#   POST /text/game/set?value=Assetto%20Corsa
#   POST /number/heartbeat/set?value=42
#   POST /number/brightness/set?value=80
#
# Entity names are deliberately lowercase and match the URLs above.
# ---------------------------------------------------------------------------

substitutions:
  device_name: cyd-flags
  friendly_name: CYD Flags
  # Original CYD (micro-USB only, ILI9341):
  display_model: ESP32-2432S028
  # Dual-USB CYD with ST7789V:            ESP32-2432S028-7789
  # Dual-USB CYD with ILI9342:            ESP32-2432S028-9342
  # 0 = portrait 240x320 (USB port at the top/bottom), 90 = landscape 320x240.
  # The layout below adapts to both; 180/270 flip the image.
  display_rotation: "0"
  backlight_pin: GPIO21
  # Optional alarm tone pin (GPIO26 has the small speaker on many CYD boards).
  # On boards without a speaker this is simply silent.
  alarm_sound_pin: GPIO26

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2024.10.0
  on_boot:
    # Runs after all components (including the LEDC output) have been set up.
    # Setting the backlight earlier fails with "ledc.output: Not yet
    # initialized" and leaves the panel dark.
    - priority: -100
      then:
        - output.set_level:
            id: backlight
            level: 0.9

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${friendly_name} fallback"
    password: !secret fallback_password
    # Start the setup AP quickly instead of waiting the default 90 s.
    ap_timeout: 15s

captive_portal:

# Lets ESPHome Web / the ESPHome dashboard ask for your WiFi name and password
# right after the first USB flash (Improv over the USB serial port). This is
# the easiest path for a new device; the fallback AP below remains available
# if provisioning is skipped.
improv_serial:

# Real wall clock for the idle screen. Requires the CYD to have internet
# access (it does not need to reach the PC, just an NTP server).
time:
  - platform: sntp
    id: wall_clock
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

web_server:
  port: 80
  # version 2 is the default. The REST paths used above are the same in v2/v3.

ota:
  - platform: esphome
    password: !secret ota_password

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------

spi:
  # Display bus (HSPI). MISO is not needed for the write-only panel; leaving
  # GPIO12 free also avoids the MTDI strapping-pin warning.
  - id: lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13
  # The XPT2046 touch controller has its own SPI pins on the CYD.
  - id: touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    id: screen
    model: ${display_model}
    spi_id: lcd
    rotation: ${display_rotation}
    # 25% of 240x320x16bpp = ~38 KB. The driver draws the panel in horizontal
    # bands, so a full-screen lambda still works without PSRAM. Keeping the
    # buffer small leaves enough heap for WiFi + web server.
    buffer_size: 25%
    # Redraw at a fixed cadence instead of on every entity change. During a
    # chaotic race the flag can change several times per second; drawing every
    # change made the panel fall behind. 300 ms still feels immediate.
    update_interval: 300ms

    lambda: |-
      const int W = it.get_width();
      const int H = it.get_height();
      const bool portrait = H > W;

      const bool link = id(link_seen) && (millis() - id(link_last_ms) < 5000);
      // WiFi and SimHub are reported separately: a missing heartbeat has a
      // different cause (PC/SimHub off) than a missing WiFi association.
      const bool wifi_connected = wifi::global_wifi_component != nullptr
                                  && wifi::global_wifi_component->is_connected();
      const bool wifi_ap = wifi::global_wifi_component != nullptr
                           && wifi::global_wifi_component->is_ap_active();
      const std::string flag = id(flag_state);
      const bool flag_active = id(feat_flags) && link && flag != "NONE";
      const bool checkered = flag_active && flag == "CHECKERED";

      auto now = id(wall_clock).now();
      std::string clock_text = "--:--";
      std::string date_text = "CLOCK SYNC";
      if (now.is_valid()) {
        clock_text = now.strftime("%H:%M");
        date_text = now.strftime("%d.%m.%Y");
      }

      // Race payload: three rows, ';' between rows and '~' between fields:
      // position~name~gap~gapcolor~lap~lapcolor. The plugin sends this only
      // for a real race session; practice/qualifying/menus fall back to the
      // clock. Color codes: -=none, G=green, R=red, P=purple.
      const std::string timing = id(timing_raw);
      const std::string logic_text = id(logic).state;

      // Rev payload: gear~speed_kmh~rpm~max_rpm~redline~rpm_percent~blink.
      const std::string rev_text = id(rev_raw);
      std::string rev_f[7];
      int rev_count = 0;
      if (!rev_text.empty()) {
        size_t q = 0;
        while (rev_count < 7 && q <= rev_text.size()) {
          size_t sep = rev_text.find('~', q);
          if (sep == std::string::npos) sep = rev_text.size();
          rev_f[rev_count++] = rev_text.substr(q, sep - q);
          if (sep == rev_text.size()) break;
          q = sep + 1;
        }
      }
      const bool rev_ready = id(feat_rev) && link && rev_count > 0 && !rev_f[0].empty();

      // A flag still takes over the whole screen. A real race has the tower
      // and logic pages; rev is also available in practice/qualifying.
      const bool race_session = id(race_mode) && !flag_active
                                && (!timing.empty() || !logic_text.empty());
      const bool avail_tower = id(feat_tower) && race_session && !timing.empty();
      const bool avail_logic = id(feat_logic) && race_session && !logic_text.empty();
      const bool avail_clock = id(feat_clock);
      const bool avail_rev = rev_ready;
      int view = id(race_view);
      const bool avail[4] = {avail_tower, avail_logic, avail_clock, avail_rev};
      if (view < 0 || view > 3 || !avail[view]) {
        const int order[4] = {0, 1, 3, 2};
        for (int i = 0; i < 4; i++) {
          if (avail[order[i]]) { view = order[i]; break; }
        }
      }

      const bool race = view == 0 && avail_tower;
      const bool logic_page = view == 1 && avail_logic;
      const bool rev_page = view == 3 && avail_rev && !flag_active;
      const bool clock_page = view == 2 && avail_clock;

      // Pages the corner navigation may visit. Keep these rules in sync with
      // the on_touch lambda below.
      const bool nav_tower = id(feat_tower) && race_session && !timing.empty();
      const bool nav_logic = id(feat_logic) && race_session && !logic_text.empty();
      const bool nav_clock = id(feat_clock);
      const bool nav_rev = rev_ready;
      const int nav_page_count = (nav_tower ? 1 : 0) + (nav_logic ? 1 : 0)
                                 + (nav_clock ? 1 : 0) + (nav_rev ? 1 : 0);
      // The touch lambda blocks whenever a flag is latched, with or without a
      // link; hide the hint under the same rule so it never advertises dead
      // buttons.
      const bool nav_blocked_by_flag = id(feat_flags) && flag != "NONE";

      Color bg = Color(12, 14, 20);
      Color fg = Color(235, 235, 240);

      if (!race && !logic_page && !rev_page) {
        if (!flag_active) {
          bg = Color(12, 14, 20);
          fg = Color(235, 235, 240);
        } else if (flag == "GREEN") {
          bg = Color(0, 140, 60); fg = Color(255, 255, 255);
        } else if (flag == "YELLOW") {
          bg = Color(255, 205, 0); fg = Color(20, 16, 0);
        } else if (flag == "BLUE") {
          bg = Color(0, 70, 200); fg = Color(255, 255, 255);
        } else if (flag == "WHITE") {
          bg = Color(235, 235, 235); fg = Color(10, 10, 10);
        } else if (flag == "CHECKERED") {
          bg = Color(235, 235, 235); fg = Color(255, 255, 255);
        } else if (flag == "RED") {
          bg = Color(200, 20, 25); fg = Color(255, 255, 255);
        } else if (flag == "BLACK") {
          bg = Color(8, 8, 8); fg = Color(240, 240, 240);
        } else if (flag == "ORANGE") {
          bg = Color(255, 110, 0); fg = Color(20, 10, 0);
        }
      }

      if (rev_page) {
        bg = Color(10, 12, 18);
        fg = Color(235, 235, 240);
        if (rev_count > 6 && rev_f[6] == "1" && (millis() / 250) % 2 == 0) {
          bg = Color(190, 20, 25);
          fg = Color(255, 255, 255);
        }
      }
      it.fill(bg);

      // ---- Alarm clock ----------------------------------------------------
      // Fire once per day: the day-of-year is the date key, so the alarm does
      // not re-trigger during the whole minute it matches.
      if (now.is_valid() && id(alarm_enabled) && !id(alarm_edit)
          && now.hour == id(alarm_hour) && now.minute == id(alarm_minute)
          && (int) now.day_of_year != id(alarm_fired_day)) {
        id(alarm_active) = true;
        id(alarm_fired_day) = (int) now.day_of_year;
      }

      // The alarm overlay wins over races, pages and flags.
      if (id(alarm_active)) {
        const bool flash = (millis() / 500) % 2 == 0;
        it.fill(flash ? Color(210, 25, 30) : Color(245, 240, 235));
        const Color ink = flash ? Color(255, 255, 255) : Color(150, 12, 16);
        it.print(W / 2, H / 2 - 62, id(font_hero), ink, TextAlign::CENTER, "ALARM");
        it.print(W / 2, H / 2 + 8, id(font_hero), ink, TextAlign::CENTER, clock_text.c_str());
        it.print(W / 2, H / 2 + 74, id(font_sub), ink, TextAlign::CENTER, "TAP TO STOP");
        if (!id(alarm_buzzer).is_playing()) {
          id(alarm_buzzer).play("alarm:d=8,o=6,b=240:c,p,c,p");
        }
        return;
      }

      // Alarm setup: four quadrants, nothing else. Tap handling below.
      if (id(alarm_edit)) {
        it.fill(Color(12, 14, 20));
        char alarm_text[8];
        snprintf(alarm_text, sizeof(alarm_text), "%02d:%02d", id(alarm_hour), id(alarm_minute));
        it.print(W / 2, H / 6, id(font_hero), Color(235, 235, 240), TextAlign::CENTER, "ALARM");
        it.print(W / 2, H * 2 / 5, id(font_hero), Color(255, 200, 70), TextAlign::CENTER, alarm_text);
        it.print(W / 2, H * 3 / 5, id(font_sub),
                 id(alarm_enabled) ? Color(255, 120, 90) : Color(140, 145, 155),
                 TextAlign::CENTER, id(alarm_enabled) ? "ARMED" : "OFF");
        it.print(10, 10, id(font_small), Color(150, 155, 165), TextAlign::CENTER_LEFT, "+1h");
        it.print(W - 10, 10, id(font_small), Color(150, 155, 165), TextAlign::CENTER_RIGHT, "+5m");
        it.print(10, H - 10, id(font_small), Color(150, 155, 165), TextAlign::CENTER_LEFT, "OFF");
        it.print(W - 10, H - 10, id(font_small), Color(150, 155, 165), TextAlign::CENTER_RIGHT, "SAVE");
        it.print(W / 2, H * 4 / 5, id(font_small), Color(150, 155, 165), TextAlign::CENTER,
                 "TL +1h   TR +5m");
        it.print(W / 2, H * 9 / 10, id(font_small), Color(150, 155, 165), TextAlign::CENTER,
                 "BL off/cancel   BR save");
        return;
      }

      // Connection screen: say which link is missing instead of a vague
      // "NO LINK". When WiFi and SimHub are both present this is skipped, so
      // the normal clock does not repeat two redundant "OK" labels.
      if (!wifi_connected || !link) {
        it.fill(Color(12, 14, 20));
        std::string status;
        std::string hint;
        Color status_color(255, 185, 70);
        if (!wifi_connected) {
          if (wifi_ap) {
            status = "WIFI: SETUP AP";
            hint = "CYD Flags fallback / 192.168.4.1";
          } else {
            status = "NO WIFI";
            hint = "CHECK WIFI / ROUTER";
          }
        } else {
          status = "NO SIMHUB";
          hint = "START SIMHUB ON PC";
          status_color = Color(130, 200, 255);
        }
        it.print(W / 2, portrait ? 132 : 96, id(font_hero), Color(235, 235, 240),
                 TextAlign::CENTER, clock_text.c_str());
        it.print(W / 2, portrait ? 194 : 150, id(font_sub), status_color,
                 TextAlign::CENTER, status.c_str());
        it.print(W / 2, portrait ? 222 : 178, id(font_small), Color(160, 165, 175),
                 TextAlign::CENTER, hint.c_str());

        // Keep the local alarm reachable even when SimHub/WiFi is down.
        if (id(feat_clock)) {
          const bool armed = id(alarm_enabled);
          const Color alarm_color = armed ? Color(255, 120, 90) : Color(150, 155, 165);
          const int ax = 18, ay = 18;
          it.circle(ax, ay, 8, alarm_color);
          it.line(ax, ay, ax, ay - 5, alarm_color);
          it.line(ax, ay, ax + 5, ay, alarm_color);
          it.line(ax - 7, ay - 9, ax - 3, ay - 5, alarm_color);
          it.line(ax + 7, ay - 9, ax + 3, ay - 5, alarm_color);
          if (armed) {
            char alarm_text[10];
            snprintf(alarm_text, sizeof(alarm_text), "AL %02d:%02d",
                     id(alarm_hour), id(alarm_minute));
            it.print(ax + 14, ay, id(font_small), alarm_color, TextAlign::CENTER_LEFT, alarm_text);
          }
        }
        return;
      }

      // Nothing enabled for this state (e.g. flags-only and no flag): say so
      // instead of leaving a confusing clock that the user disabled.
      if (!race && !logic_page && !rev_page && !flag_active && !id(feat_clock) && !clock_page) {
        it.print(W / 2, H / 2, id(font_sub), Color(130, 135, 145), TextAlign::CENTER,
                 "NO PAGE");
        return;
      }

      // Checkered pattern: 20 px squares, exactly fills both orientations.
      if (checkered) {
        for (int y = 0; y < H; y += 20) {
          for (int x = 0; x < W; x += 20) {
            if (((x / 20) + (y / 20)) % 2 == 0) {
              it.filled_rectangle(x, y, 20, 20, Color(20, 20, 20));
            }
          }
        }
        if (portrait) {
          it.filled_rectangle(0, 90, W, 140, Color(0, 0, 0));
        } else {
          it.filled_rectangle(0, 64, W, 112, Color(0, 0, 0));
        }
      }

      // The IP is only a boot hint: show it for 15 s after WiFi got a lease,
      // then get out of the way.
      const bool show_ip = millis() < id(ip_until) && !id(ip_address).state.empty();

      // Corner-navigation hint: a dim < bottom-left and > bottom-right. Hidden
      // while a flag or the boot IP hint owns the screen, and only drawn when
      // there is at least one other page to reach. Top corners are reserved.
      auto draw_nav_hint = [&]() {
        if (!nav_blocked_by_flag && nav_page_count >= 2 && !show_ip) {
          it.print(6, H - 16, id(font_small), Color(90, 95, 105), TextAlign::CENTER_LEFT, "<");
          it.print(W - 6, H - 16, id(font_small), Color(90, 95, 105), TextAlign::CENTER_RIGHT, ">");
        }
      };

      if (rev_page) {
        auto rev_int = [](const std::string &value) {
          return (value.empty() || value == "-") ? 0 : atoi(value.c_str());
        };
        const bool has_speed = rev_count > 1 && rev_f[1] != "-";
        const bool has_rpm = rev_count > 2 && rev_f[2] != "-";
        const int max_rpm = rev_count > 3 ? rev_int(rev_f[3]) : 0;
        const int redline = rev_count > 4 ? rev_int(rev_f[4]) : 0;
        int percent = rev_count > 5 ? rev_int(rev_f[5]) : 0;
        if (percent < 0) percent = 0;
        if (percent > 100) percent = 100;

        const int bar_x = 8;
        const int bar_y = 8;
        const int bar_w = W - 16;
        const int bar_h = 10;
        it.filled_rectangle(bar_x, bar_y, bar_w, bar_h, Color(35, 38, 48));
        const int fill_w = bar_w * percent / 100;
        if (fill_w > 0) {
          Color fill(60, 220, 120);
          if (percent >= 90) fill = Color(255, 70, 60);
          else if (percent >= 70) fill = Color(255, 200, 40);
          it.filled_rectangle(bar_x, bar_y, fill_w, bar_h, fill);
        }
        if (max_rpm > 0 && redline > 0 && redline < max_rpm) {
          int red_x = bar_x + (bar_w * redline) / max_rpm;
          it.filled_rectangle(red_x, bar_y, 2, bar_h, Color(255, 255, 255));
        }
        it.print(8, 27, id(font_small), Color(170, 175, 185), TextAlign::CENTER_LEFT, "REV");
        std::string rpm_line = has_rpm ? rev_f[2] + " RPM" : "-- RPM";
        it.print(W - 8, 27, id(font_small), Color(170, 175, 185), TextAlign::CENTER_RIGHT,
                 rpm_line.c_str());

        it.print(W / 2, portrait ? 168 : 118, id(font_gear), fg, TextAlign::CENTER,
                 rev_f[0].c_str());
        std::string speed_line = has_speed ? rev_f[1] + " km/h" : "-- km/h";
        it.print(W / 2, portrait ? 264 : 208, id(font_speed), Color(210, 215, 225),
                 TextAlign::CENTER, speed_line.c_str());

        if (show_ip) {
          it.print(6, H - 12, id(font_small), Color(150, 150, 160), TextAlign::CENTER_LEFT,
                   id(ip_address).state.c_str());
        }
        draw_nav_hint();
        return;
      }

      if (logic_page) {
        // Current lap, live delta to the personal best, and the three sectors.
        // Payload: lap~lapcolor~delta~deltacolor~s1~s1color~s2~s2color~s3~s3color
        std::string f[10];
        int count = 0;
        size_t p = 0;
        while (count < 10 && p <= logic_text.size()) {
          size_t sep = logic_text.find('~', p);
          if (sep == std::string::npos) sep = logic_text.size();
          f[count++] = logic_text.substr(p, sep - p);
          if (sep == logic_text.size()) break;
          p = sep + 1;
        }

        it.print(6, 8, id(font_small), Color(190, 195, 205), TextAlign::CENTER_LEFT, clock_text.c_str());
        it.print(W / 2, 8, id(font_small), Color(150, 155, 165), TextAlign::CENTER, "RACE LOGIC");
        if (show_ip) {
          it.print(W - 6, 8, id(font_small), Color(150, 150, 160), TextAlign::CENTER_RIGHT, id(ip_address).state.c_str());
        }

        it.print(W / 2, portrait ? 40 : 28, id(font_small), Color(150, 155, 165), TextAlign::CENTER, "CURRENT LAP");
        it.print(W / 2, portrait ? 58 : 46, id(font_lap), Color(235, 235, 240), TextAlign::CENTER, count > 0 ? f[0].c_str() : "--:--.---");

        const int delta_y = portrait ? 122 : 94;
        it.print(14, delta_y + 3, id(font_small), Color(150, 155, 165), TextAlign::CENTER_LEFT, "DELTA BEST");
        Color delta_color(180, 185, 195);
        if (count > 3 && f[3] == "G") delta_color = Color(80, 240, 130);
        else if (count > 3 && f[3] == "R") delta_color = Color(255, 90, 80);
        it.print(W - 14, delta_y, id(font_sub), delta_color, TextAlign::CENTER_RIGHT, count > 2 ? f[2].c_str() : "--.---");

        const int sector_top = portrait ? 160 : 116;
        const int sector_h = portrait ? 48 : 38;
        const char *sector_labels[3] = {"S1", "S2", "S3"};
        for (int i = 0; i < 3; i++) {
          int y = sector_top + i * sector_h;
          Color card(26, 30, 40);
          if (count > 5 + i * 2) {
            if (f[5 + i * 2] == "G") card = Color(0, 120, 55);
            else if (f[5 + i * 2] == "R") card = Color(190, 25, 30);
          }
          it.filled_rectangle(8, y, W - 16, sector_h - 4, card);
          it.print(18, y + 8, id(font_sub), Color(245, 245, 245), TextAlign::CENTER_LEFT, sector_labels[i]);
          it.print(W - 18, y + 8, id(font_sub), Color(245, 245, 245), TextAlign::CENTER_RIGHT,
                   count > 4 + i * 2 ? f[4 + i * 2].c_str() : "--.---");
        }
        draw_nav_hint();
        return;
      }

      if (race) {
        // Small clock top-left; the last/best label sits centred; the IP is a
        // short-lived boot hint on the right.
        it.print(6, 8, id(font_small), Color(190, 195, 205), TextAlign::CENTER_LEFT, clock_text.c_str());
        it.print(W / 2, 8, id(font_small), Color(150, 155, 165), TextAlign::CENTER, id(lap_label).state.c_str());
        if (show_ip) {
          it.print(W - 6, 8, id(font_small), Color(150, 150, 160), TextAlign::CENTER_RIGHT, id(ip_address).state.c_str());
        }

        // Three rows: position~name~gap~gapcolor~lap~lapcolor.
        std::string fields[3][6];
        int rows = 0;
        size_t p = 0;
        while (rows < 3 && p <= timing.size()) {
          size_t semi = timing.find(';', p);
          if (semi == std::string::npos) semi = timing.size();
          std::string line = timing.substr(p, semi - p);
          int col = 0;
          size_t q = 0;
          while (col < 6 && q <= line.size()) {
            size_t sep = line.find('~', q);
            if (sep == std::string::npos) sep = line.size();
            fields[rows][col] = line.substr(q, sep - q);
            col++;
            if (sep == line.size()) break;
            q = sep + 1;
          }
          rows++;
          if (semi == timing.size()) break;
          p = semi + 1;
        }

        if (rows == 0) {
          // No relative data yet: keep the clock readable.
          it.print(W / 2, H / 2 - 20, id(font_hero), Color(235, 235, 240), TextAlign::CENTER, clock_text.c_str());
          draw_nav_hint();
          return;
        }

        // Draw a lap time with a P/R/G background when the plugin says so.
        auto draw_time = [&](int x, int y, auto *font, const std::string &text,
                             const std::string &code, Color normal) {
          Color bg_time(0, 0, 0);
          Color fg_time = normal;
          if (code == "P") {
            bg_time = Color(135, 60, 200); fg_time = Color(255, 255, 255);
          } else if (code == "R") {
            bg_time = Color(190, 25, 30); fg_time = Color(255, 255, 255);
          } else if (code == "G") {
            bg_time = Color(0, 120, 55); fg_time = Color(255, 255, 255);
          }
          if (code == "P" || code == "R" || code == "G") {
            int x1, y1, w, h;
            it.get_text_bounds(x, y, text.c_str(), font, TextAlign::CENTER_LEFT, &x1, &y1, &w, &h);
            it.filled_rectangle(x1 - 1, y1 - 1, w + 2, h + 2, bg_time);
          }
          it.print(x, y, font, fg_time, TextAlign::CENTER_LEFT, text.c_str());
        };

        // No sector times any more: the extra height makes the lap time and
        // driver name noticeably bigger.
        const int row_h = portrait ? 80 : 58;
        const int top = portrait ? 24 : 20;
        for (int i = 0; i < rows; i++) {
          int y = top + i * row_h;
          if (i == 1) {
            it.filled_rectangle(0, y, W, row_h - 2, Color(22, 32, 50));
          }

          // Small position badge, larger name/lap time.
          it.filled_rectangle(4, y + 10, 26, 26, Color(245, 245, 245));
          it.print(17, y + 23, id(font_row_pos), Color(10, 10, 12), TextAlign::CENTER, fields[i][0].c_str());

          std::string name = fields[i][1];
          if (name.size() > 11) name = name.substr(0, 11);
          it.print(34, y + 10, id(font_row_name), fg, TextAlign::CENTER_LEFT, name.c_str());

          Color gap_color(130, 220, 255);
          if (fields[i][3] == "G") {
            gap_color = Color(80, 240, 130);
          } else if (fields[i][3] == "R") {
            gap_color = Color(255, 90, 80);
          }
          if (!fields[i][2].empty()) {
            it.print(W - 5, y + 10, id(font_sub), gap_color, TextAlign::CENTER_RIGHT, fields[i][2].c_str());
          }

          draw_time(34, y + 42, id(font_row_name), fields[i][4], fields[i][5], Color(215, 220, 230));
          it.line(4, y + row_h - 2, W - 4, y + row_h - 2, Color(40, 46, 58));
        }
        draw_nav_hint();
        return;
      }

      // Clock / flag screen. Flag names keep priority over the clock.
      std::string title = clock_text;
      std::string sub = date_text;
      if (flag_active) {
        if (flag == "GREEN") {
          title = "GREEN"; sub = "TRACK CLEAR";
        } else if (flag == "YELLOW") {
          title = "YELLOW"; sub = "CAUTION";
        } else if (flag == "BLUE") {
          title = "BLUE"; sub = "LET FASTER CARS BY";
        } else if (flag == "WHITE") {
          title = "WHITE"; sub = "FINAL LAP";
        } else if (flag == "CHECKERED") {
          title = "FINISH"; sub = "CHECKERED FLAG";
        } else if (flag == "RED") {
          title = "RED"; sub = "SESSION STOPPED";
        } else if (flag == "BLACK") {
          title = "BLACK"; sub = "PENALTY - PIT";
        } else if (flag == "ORANGE") {
          title = "ORANGE"; sub = "MEATBALL - DAMAGE";
        }
      }

      const bool clock_screen = !flag_active;
      const Color hero_color = link ? fg : Color(255, 185, 70);
      const Color sub_color = link ? fg : Color(210, 170, 90);
      const int hero_y = portrait ? 152 : (checkered ? 104 : 112);
      const int sub_y = portrait ? 206 : (checkered ? 154 : 166);
      auto *hero_font = id(font_hero);
      if (portrait && !clock_screen) hero_font = id(font_hero_p);
      it.print(W / 2, hero_y, hero_font, hero_color, TextAlign::CENTER, title.c_str());
      it.print(W / 2, sub_y, id(font_sub), sub_color, TextAlign::CENTER, sub.c_str());

      // Idle clock screen: small alarm shortcut top-left.
      if (!race_session && !flag_active && id(feat_clock)) {
        const bool armed = id(alarm_enabled);
        const Color alarm_color = armed ? Color(255, 120, 90) : Color(150, 155, 165);
        const int ax = 18, ay = 18;
        it.circle(ax, ay, 8, alarm_color);
        it.line(ax, ay, ax, ay - 5, alarm_color);
        it.line(ax, ay, ax + 5, ay, alarm_color);
        it.line(ax - 7, ay - 9, ax - 3, ay - 5, alarm_color);
        it.line(ax + 7, ay - 9, ax + 3, ay - 5, alarm_color);
        if (armed) {
          char alarm_text[10];
          snprintf(alarm_text, sizeof(alarm_text), "AL %02d:%02d",
                   id(alarm_hour), id(alarm_minute));
          it.print(ax + 14, ay, id(font_small), alarm_color, TextAlign::CENTER_LEFT, alarm_text);
        }
      }

      if (show_ip) {
        it.print(6, H - 12, id(font_small), Color(150, 150, 160), TextAlign::CENTER_LEFT, id(ip_address).state.c_str());
      }

      draw_nav_hint();

# Quadrant navigation: bottom-left = previous page, bottom-right = next page.
# A 24 px dead cross through the centre (12 px each side) keeps seam taps from
# picking a page by accident; the top corners are reserved for later.
# Flags keep priority, and taps outside a race are ignored.
touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch
    cs_pin: GPIO33
    update_interval: 50ms
    calibration:
      x_min: 0
      x_max: 4095
      y_min: 0
      y_max: 4095
    on_touch:
      - lambda: |-
          const int W = id(screen).get_width();
          const int H = id(screen).get_height();
          const int x = touch.x;
          const int y = touch.y;

          // Alarm overlay: any tap dismisses it. The alarm stays armed for the
          // next day.
          if (id(alarm_active)) {
            id(alarm_active) = false;
            id(alarm_buzzer).stop();
            return;
          }

          // Alarm setup: four quadrants; page navigation is suspended.
          // TL hour +1, TR minute +5, BL cancel/off, BR save + arm.
          if (id(alarm_edit)) {
            if (y < H / 2) {
              if (x < W / 2) id(alarm_hour) = (id(alarm_hour) + 1) % 24;
              else id(alarm_minute) = (id(alarm_minute) + 5) % 60;
            } else {
              if (x < W / 2) {
                id(alarm_enabled) = false;
              } else {
                id(alarm_enabled) = true;
                id(alarm_fired_day) = -1;
              }
              id(alarm_edit) = false;
            }
            return;
          }

          // Idle clock screen: top-left opens the alarm setup.
          const bool touch_link = id(link_seen) && (millis() - id(link_last_ms) < 5000);
          const bool touch_flag = id(feat_flags) && touch_link && id(flag_state) != "NONE";
          const bool touch_race = id(race_mode) && touch_link && !touch_flag
                                  && (!id(timing_raw).empty() || !id(logic).state.empty());
          if (!touch_race && !touch_flag && id(feat_clock)
              && x < W / 2 && y < H / 2) {
            id(alarm_edit) = true;
            return;
          }

          // 24 px dead cross: ignore the centre seam (12 px each side).
          if (std::abs(x - W / 2) < 12 || std::abs(y - H / 2) < 12) return;

          // An active flag owns the display; the corners do nothing then.
          const bool blocked_by_flag = id(feat_flags) && id(flag_state) != "NONE";
          if (blocked_by_flag) return;

          // Top half is reserved for the clock/alarm controls.
          if (y < H / 2) return;

          // Pages the navigation may visit, indexed like race_view:
          // 0 = timing tower, 1 = race logic, 2 = clock, 3 = rev limiter.
          const int kPageCount = 4;
          const bool available[kPageCount] = {
              id(race_mode) && id(feat_tower) && !id(timing_raw).empty(),
              id(race_mode) && id(feat_logic) && !id(logic).state.empty(),
              id(feat_clock),
              id(feat_rev) && !id(rev_raw).empty() && id(link_seen),
          };
          const int order[kPageCount] = {0, 1, 3, 2};

          bool any_available = false;
          for (int i = 0; i < kPageCount; i++) {
            if (available[i]) any_available = true;
          }
          if (!any_available) return;

          // Bottom-left goes back, bottom-right goes forward; both wrap.
          const int direction = (x > W / 2) ? 1 : -1;
          int pos = 0;
          for (int i = 0; i < kPageCount; i++) {
            if (order[i] == id(race_view)) pos = i;
          }
          for (int step = 1; step <= kPageCount; step++) {
            int candidate = order[(pos + direction * step + kPageCount) % kPageCount];
            if (available[candidate]) {
              id(race_view) = candidate;
              break;
            }
          }
font:
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_hero
    size: 62
    glyphs: "ABCDEFGHIKLMNORSTUWY 0123456789:-"
  # Portrait flag names: 39 px keeps CHECKERED inside 240 px.
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_hero_p
    size: 39
    glyphs: "ABCDEFGHIKLMNORSTUWY "
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_row_pos
    size: 15
    glyphs: "0123456789?"
  # Current lap time on the race-logic page (fits 240 px at 40 px).
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_lap
    size: 40
    glyphs: "0123456789:.-"
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_row_name
    size: 22
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,:;!?()[]&+/-_'~"
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_sub
    size: 22
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,:;!?()[]&+/-_'~"
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_gear
    size: 120
    glyphs: "0123456789RN-+"
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_speed
    size: 28
    glyphs: "0123456789 km/h-"
  - file: "fonts/DejaVuSansCondensed-Bold.ttf"
    id: font_small
    size: 13
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,:;!?()[]&+/-_'~<>"

# ---------------------------------------------------------------------------
# Backlight
# ---------------------------------------------------------------------------

output:
  - platform: ledc
    id: backlight
    pin: ${backlight_pin}
    frequency: 2000Hz
  # Optional alarm buzzer; silent unless the alarm overlay is active.
  - platform: ledc
    id: alarm_output
    pin: ${alarm_sound_pin}
    frequency: 2000Hz

rtttl:
  - id: alarm_buzzer
    output: alarm_output
    gain: 0.35

# ---------------------------------------------------------------------------
# State for the display
# ---------------------------------------------------------------------------

globals:
  - id: flag_state
    type: std::string
    restore_value: false
    initial_value: '"NONE"'
  - id: game_name
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: link_seen
    type: bool
    restore_value: false
    initial_value: "false"
  - id: link_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: race_mode
    type: bool
    restore_value: false
    initial_value: "false"
  - id: timing_raw
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: ip_until
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # Set by a tap on the panel; only affects the race view. Flags still win.
  # 0 = timing tower, 1 = race logic, 2 = clock.
  - id: race_view
    type: int
    restore_value: false
    initial_value: "0"
  - id: rev_raw
    type: std::string
    restore_value: false
    initial_value: '""'
  # Pages/features enabled from the SimHub plugin. "none" disables all pages.
  - id: feature_list
    type: std::string
    restore_value: true
    initial_value: '"flags,clock,tower,logic,rev"'
  - id: feat_flags
    type: bool
    restore_value: false
    initial_value: "true"
  - id: feat_clock
    type: bool
    restore_value: false
    initial_value: "true"
  - id: feat_tower
    type: bool
    restore_value: false
    initial_value: "true"
  - id: feat_logic
    type: bool
    restore_value: false
    initial_value: "true"
  - id: feat_rev
    type: bool
    restore_value: false
    initial_value: "true"
  - id: alarm_hour
    type: int
    restore_value: true
    initial_value: "7"
  - id: alarm_minute
    type: int
    restore_value: true
    initial_value: "0"
  - id: alarm_enabled
    type: bool
    restore_value: true
    initial_value: "false"
  - id: alarm_edit
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alarm_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alarm_fired_day
    type: int
    restore_value: false
    initial_value: "-1"

select:
  - platform: template
    name: flag
    id: flag
    optimistic: true
    initial_option: NONE
    options:
      - NONE
      - GREEN
      - YELLOW
      - BLUE
      - WHITE
      - CHECKERED
      - RED
      - BLACK
      - ORANGE
    on_value:
      - lambda: |-
          id(flag_state) = x;

text:
  # WiFi provisioning: the plugin writes SSID/password here and presses the
  # wifi_connect button. save: true stores them in the ESP32 NVS, so they
  # survive OTA updates and power cycles. A full USB/factory flash erases NVS.
  - platform: template
    name: wifi_ssid
    id: wifi_ssid
    optimistic: true
    mode: text
    min_length: 0
    max_length: 32
  - platform: template
    name: wifi_password
    id: wifi_password
    optimistic: true
    mode: password
    min_length: 0
    max_length: 64
  - platform: template
    name: game
    id: game
    optimistic: true
    mode: text
    min_length: 0
    max_length: 64
    on_value:
      - lambda: |-
          id(game_name) = x;
  - platform: template
    name: timing
    id: timing
    optimistic: true
    mode: text
    min_length: 0
    max_length: 255
    on_value:
      - lambda: |-
          id(timing_raw) = x;
  - platform: template
    name: race
    id: race
    optimistic: true
    mode: text
    min_length: 0
    max_length: 8
    on_value:
      - lambda: |-
          id(race_mode) = (x == "RACE");
          if (x != "RACE") id(race_view) = 0;
  - platform: template
    name: logic
    id: logic
    optimistic: true
    mode: text
    min_length: 0
    max_length: 255
  - platform: template
    name: delta
    id: delta
    optimistic: true
    mode: text
    min_length: 0
    max_length: 16
  - platform: template
    name: rev
    id: rev
    optimistic: true
    mode: text
    min_length: 0
    max_length: 64
    on_value:
      - lambda: |-
          id(rev_raw) = x;
  - platform: template
    name: lap_label
    id: lap_label
    optimistic: true
    mode: text
    min_length: 0
    max_length: 8
  # Comma-separated page list sent by the plugin: flags,clock,tower,logic,rev.
  # An empty value means "all pages" for compatibility; "none" hides all.
  - platform: template
    name: features
    id: features
    optimistic: true
    mode: text
    min_length: 0
    max_length: 64
    initial_value: "flags,clock,tower,logic,rev"
    restore_value: true
    on_value:
      - lambda: |-
          id(feature_list) = x;
          id(feat_flags) = x.empty() || x.find("flags") != std::string::npos;
          id(feat_clock) = x.empty() || x.find("clock") != std::string::npos;
          id(feat_tower) = x.empty() || x.find("tower") != std::string::npos;
          id(feat_logic) = x.empty() || x.find("logic") != std::string::npos;
          id(feat_rev) = x.empty() || x.find("rev") != std::string::npos;
          if (!id(feat_tower) && id(race_view) == 0) id(race_view) = id(feat_logic) ? 1 : 2;
          if (!id(feat_logic) && id(race_view) == 1) id(race_view) = id(feat_clock) ? 2 : 0;
          if (!id(feat_clock) && id(race_view) == 2) id(race_view) = id(feat_tower) ? 0 : 1;
          if (!id(feat_rev) && id(race_view) == 3) id(race_view) = 0;

  # Per-CYD orientation, selected in the SimHub plugin. Landscape rotates the
  # panel by 90 degrees at runtime, so one firmware supports both mountings.
  - platform: template
    name: orientation
    id: orientation
    optimistic: true
    mode: text
    min_length: 0
    max_length: 8
    initial_value: "portrait"
    restore_value: true
    on_value:
      - lambda: |-
          const bool landscape = (x == "landscape");
          id(screen).set_rotation(landscape ? display::DISPLAY_ROTATION_90_DEGREES
                                            : display::DISPLAY_ROTATION_0_DEGREES);
          if (id(screen).is_ready()) id(screen).update();

button:
  - platform: template
    name: wifi_connect
    id: wifi_connect
    on_press:
      - wifi.configure:
          ssid: !lambda 'return id(wifi_ssid).state;'
          password: !lambda 'return id(wifi_password).state;'
          save: true
          timeout: 30s

number:
  # Backlight brightness, 0..100 %. The panel is on by default after boot.
  - platform: template
    name: brightness
    id: brightness
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    mode: slider
    initial_value: 90
    on_value:
      - output.set_level:
          id: backlight
          level: !lambda "return x / 100.0f;"

  # Heartbeat is a monotonically increasing counter written by the SimHub
  # plugin about once per second. Any value refreshes the link timer.
  - platform: template
    name: heartbeat
    id: heartbeat
    optimistic: true
    min_value: 0
    max_value: 1000000
    step: 1
    mode: box
    initial_value: 0
    on_value:
      - lambda: |-
          id(link_seen) = true;
          id(link_last_ms) = millis();

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      internal: true
      on_value:
        - lambda: |-
            if (!x.empty()) id(ip_until) = millis() + 15000;
